[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "python-ebics-client"
version = "0.1.0"
description = "Pure-Python EBICS 3.0 (H005) client: key management, BTD downloads, BTU uploads"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dylan Merigaud" }]
keywords = ["ebics", "banking", "camt", "pain", "iso20022", "sepa", "swiss"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = ["cryptography>=41", "lxml>=4.9"]

[project.urls]
Homepage = "https://github.com/DylanMerigaud/python-ebics-client"
Source = "https://github.com/DylanMerigaud/python-ebics-client"
Issues = "https://github.com/DylanMerigaud/python-ebics-client/issues"
Changelog = "https://github.com/DylanMerigaud/python-ebics-client/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff", "mypy", "lxml-stubs"]

[tool.hatch.build.targets.wheel]
packages = ["ebics_client"]

[tool.hatch.build.targets.sdist]
include = [
    "/ebics_client",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/ruff.toml",
]

[tool.mypy]
strict = true
