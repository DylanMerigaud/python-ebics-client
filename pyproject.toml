[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "python-ebics-client"
version = "0.1.0"
description = "Pure-Python EBICS 3.0 (H005) client: key management, BTD downloads, BTU uploads"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dylan Merigaud" }]
dependencies = ["cryptography>=41", "lxml>=4.9"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["ebics_client"]
